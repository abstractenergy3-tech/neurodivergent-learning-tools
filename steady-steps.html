<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steady Steps</title>
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#14212b;--mute:#44566a;--brand:#0b6e6e;--bi:#fff;--soft:#e4eef1;--line:#b7c8cf;--ok:#17653a;--okbg:#ddf2e5;--fs:1.25rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",Arial,sans-serif;font-size:var(--fs);line-height:1.7;letter-spacing:.02em}
:root.roomy body{line-height:2.1;letter-spacing:.06em;word-spacing:.15em}
main{max-width:40rem;margin:0 auto;padding:1rem}
h1{font-size:1.5em;line-height:1.3;margin:.2em 0 .6em}
h2{font-size:1.15em;margin:1.5em 0 .5em}
p{margin:0 0 1em;max-width:34em}
ul,ol{padding-left:1.4em;margin:0 0 1em}
li{margin-bottom:.5em}
button,textarea{font:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.mini{min-height:2.75rem;padding:.25rem .9rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:.8em}
.btn{min-height:3.5rem;padding:.5rem 1.4rem;border:3px solid var(--brand);border-radius:.8rem;background:var(--brand);color:var(--bi);font-weight:bold}
.btn.alt{background:transparent;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0}
.row .btn{flex:1 1 9rem}
.card{display:block;width:100%;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin:0 0 1rem}
button.card:hover,button.card:focus-visible{border-color:var(--brand)}
button.card span{display:block;color:var(--mute);font-size:.85em}
.steps{display:flex;gap:.35rem;margin:.75rem 0 1rem}
.steps i{flex:1;height:.9rem;border-radius:.3rem;background:var(--soft);border:2px solid var(--line)}
.steps i.on{background:var(--brand);border-color:var(--brand)}
.stepno{margin:.75rem 0 0;color:var(--mute);font-size:.9em}
.ex,.note{border-left:.5rem solid var(--brand);background:var(--soft);border-radius:.5rem;padding:.6rem 1rem;margin:1rem 0}
.ex p,.note p{margin:.4em 0}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem 1rem;min-height:3.25rem;border:3px solid var(--line);border-radius:.7rem;background:var(--soft);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
#fb{min-height:1.7em;font-weight:bold;margin:.5rem 0 0}
.quiz{border-top:3px dashed var(--line);margin-top:1.25rem;padding-top:1rem}
details{background:var(--card);border:3px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;margin-bottom:.75rem}
summary{cursor:pointer;font-weight:bold;min-height:2.75rem;display:flex;align-items:center}
textarea{width:100%;box-sizing:border-box;min-height:7rem;padding:.7rem;border:3px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
label{display:block;margin:.4rem 0;font-weight:bold}
.chk{display:flex;gap:.75rem;align-items:center;min-height:3rem;font-weight:normal}
.chk input{width:1.6rem;height:1.6rem;flex:none}
</style>
</head>
<body>
<main>
<div class="tools" role="group" aria-label="Display settings">
<button class="mini" data-act="sm">Smaller text</button>
<button class="mini" data-act="lg">Larger text</button>
<button class="mini" data-act="theme">Dark or light</button>
<button class="mini" data-act="space">More space</button>
<button class="mini" data-act="brk">Need a break</button>
</div>
<div id="app"></div>
</main>
<script>
var L=[
{title:"Getting ready for a job interview",time:6,steps:[
{t:"What happens in an interview",p:["An interview is a planned talk about a job.","It usually takes 20 to 45 minutes. One or two people ask you questions. You answer. At the end, you can ask your own questions."],note:"Feeling nervous is common. Feeling calm is common too. Both are fine."},
{t:"The day before",p:["Do these things the day before:"],list:["Pick clean clothes that feel comfortable.","Find your route and how long it takes.","Plan to arrive 10 minutes early.","Write down the company name and the name of the person you will meet."],q:{q:"When is a good time to arrive?",o:["10 minutes early","1 hour late","Right when it ends"],a:0,ok:"Yes. Arriving a little early gives you time to settle.",no:"Not quite. Try another one. There is no penalty."}},
{t:"What to bring",p:["Put these in a bag the night before:"],list:["Pen and paper","Photo ID","A paper copy of your resume, if you have one","2 or 3 questions to ask them","Water"]},
{t:"During the interview",p:["Say your name when you meet them. They may offer a handshake. If that is hard, you can say “Hello, nice to meet you.”","If you need time to think, you can say so."],ex:["Interviewer: What are your strengths?","You: Can I take a moment to think?","(You pause. Then you answer.)"],note:"Eye contact is not required. Looking near their face or at your notes is fine.",q:{q:"You need time to think. What can you say?",o:["“Can I take a moment to think?”","Nothing. Leave the room.","Say the first thing that comes to mind."],a:0,ok:"Yes. Asking for a moment is clear and polite.",no:"Not quite. Try another one."}},
{t:"After the interview",p:["Say thank you before you leave.","Later that day, you can send a short message."],ex:["“Thank you for meeting me today. I enjoyed learning about the job.”"]}
]},
{title:"Your first day at work",time:5,steps:[
{t:"Before you leave home",p:["Get ready the night before and the morning of:"],list:["Eat something.","Bring water or lunch.","Check your start time.","Know who to ask for when you arrive."],note:"If noise or crowds are hard for you, it is normal to ask where a quiet place is."},
{t:"When you arrive",p:["Go to the front desk, or find the person you were told to meet."],ex:["You: Hi, I’m Sam. It’s my first day. I’m here to see Dana."],q:{q:"Who do you ask for when you arrive?",o:["The person I was told to meet","Nobody. I walk around alone.","I wait outside all day."],a:0,ok:"Yes. Going to your contact person is the clearest plan.",no:"Not quite. Try another one."}},
{t:"Learning new tasks",p:["Nobody expects you to know everything on day one. These things help:"],list:["Watch first.","Write the steps in a notebook.","Ask: “Can I have these steps in writing?”","Ask a question when you are unsure."]},
{t:"Breaks and going home",p:["Ask when your breaks are.","Before you go home, you can ask: “Is there anything else you need from me today?”","Then say goodbye. The first day is finished."]}
]},
{title:"Asking for help and for what you need",time:6,steps:[
{t:"Asking is normal",p:["Everyone needs help at work, including people who have worked there for years.","Asking questions shows you want to do the job well."]},
{t:"When words are unclear",p:["Some people say things that do not mean exactly what the words say. If you are not sure what someone means, you can check."],ex:["Manager: Can you do this soon?","You: Do you mean today, or this week?"],q:{q:"A manager says “soon”. What can you ask?",o:["“By what day or time?”","Nothing. I guess.","“Why are you so vague?”"],a:0,ok:"Yes. Asking for a day or time is clear and polite.",no:"Not quite. Try another one."}},
{t:"Asking for what helps you",p:["Many people ask for changes that help them work well. These are often called accommodations. Examples:"],list:["Instructions in writing","Notice before things change","A quiet place or short breaks","Time to think before answering"],note:"You choose whether to tell people about being autistic. You do not have to. You can just ask for what helps. Rules differ by place, so a local disability or job service can tell you more. Use “My plan” on the home page to write your own message."},
{t:"When something is too much",p:["If a place is too loud, bright, or crowded, tell your supervisor. Ask for a break or a quieter spot."],ex:["You: The noise is making it hard to focus. Can I take a 5 minute break?"],q:{q:"The room is too loud. What is a good step?",o:["Ask for a break or a quieter spot","Stay silent and push through","Quit without telling anyone"],a:0,ok:"Yes. Telling someone early is a good step.",no:"Not quite. Try another one."}}
]}
];
var D=[
["Touch base","Talk briefly.","You can ask: “When and where?”"],
["Circle back","Talk about it again later.","You can ask: “When will we talk again?”"],
["Think outside the box","Try a new idea.","You can ask: “Can you give me an example?”"],
["Hit the ground running","Start working fast.","You can ask: “What should I do first?”"],
["Do you have a minute?","A short talk. It is usually more than one minute.","You can ask: “How long will it take?”"],
["Take this offline","Talk about it later, in private, not in this meeting.","You can ask: “When should we talk?”"],
["Give me a heads-up","Tell me before it happens.","You can say: “I will tell you.”"],
["Keep me in the loop","Tell me what is happening.","You can ask: “How often would you like updates?”"],
["ASAP","As soon as possible. It can mean different times to different people.","You can ask: “By what time?”"],
["We’ll see","The answer is not decided yet.","You can ask: “When will I know?”"]
];
var A=["Tell me about yourself.","What are your strengths?","Tell me about a time you solved a problem."];
var S=["My name is… I am good at… I want this job because…","I am good at… For example, I…","The problem was… I did… The result was…"];
var H=["instructions in writing","notice before things change","a quiet place or short breaks","clear deadlines","time to think before I answer"];
var app=document.getElementById("app"),root=document.documentElement,ci=0,cn=0,cur=["home"];
var st={done:{},at:{},fs:1.25,theme:"",roomy:0,ans:{},help:{}};
var speech="speechSynthesis" in window;
try{Object.assign(st,JSON.parse(localStorage.getItem("steady")||"{}"))}catch(e){}
function save(){try{localStorage.setItem("steady",JSON.stringify(st))}catch(e){}}
function apply(){root.style.setProperty("--fs",st.fs+"rem");root.classList.toggle("roomy",!!st.roomy);if(st.theme){root.setAttribute("data-theme",st.theme)}else{root.removeAttribute("data-theme")}}
function stop(){if(speech)speechSynthesis.cancel()}
function P(a){return (a||[]).map(function(x){return "<p>"+x+"</p>"}).join("")}
function go(n,a,b){cur=[n,a,b];stop();V[n](a,b);var h=document.getElementById("h");if(h)h.focus();window.scrollTo(0,0)}
var V={
home:function(){
app.innerHTML="<h1 id='h' tabindex='-1'>Steady Steps</h1><p>Learn job skills in small steps. Every screen works the same way. Nothing moves, nothing makes sound, and there are no timers. Use the buttons above to change how this looks or to take a break.</p><h2>Lessons</h2>"+
L.map(function(l,i){var s=st.done[i]?"Finished. Do it again":st.at[i]!==undefined?"Keep going":"About "+l.time+" minutes";return "<button class='card' data-i='"+i+"'><strong>"+l.title+"</strong><span>"+l.steps.length+" steps. "+s+"</span></button>"}).join("")+
"<h2>Tools</h2><button class='card' data-act='dec'><strong>Work phrase decoder</strong><span>What common work phrases usually mean</span></button><button class='card' data-act='plan'><strong>My plan</strong><span>Write interview answers and a message about what helps you</span></button><p>Your place and your writing are saved only on this device.</p>"},
ov:function(i){
var l=L[i];
app.innerHTML="<button class='btn alt' data-act='home'>Home</button><h1 id='h' tabindex='-1'>"+l.title+"</h1><p>About "+l.time+" minutes. "+l.steps.length+" steps. You can stop at any time. Your place is saved.</p><h2>Today’s plan</h2><ol>"+l.steps.map(function(s){return "<li>"+s.t+"</li>"}).join("")+"</ol><div class='row'><button class='btn' data-start='"+i+"'>"+(st.at[i]?"Continue":"Start")+"</button></div>"},
lesson:function(i,n){
var l=L[i],s=l.steps[n],tot=l.steps.length,bars="",q="";ci=i;cn=n;st.at[i]=n;save();
for(var k=0;k<tot;k++)bars+="<i"+(k<=n?" class='on'":"")+"></i>";
if(s.q)q="<div class='quiz'><p><strong>Check what you know (optional): "+s.q.q+"</strong></p>"+s.q.o.map(function(o,k){return "<button class='opt' data-q='"+k+"'>"+o+"</button>"}).join("")+"<p id='fb' role='status'></p></div>";
app.innerHTML="<button class='btn alt' data-ov='"+i+"'>All steps in this lesson</button><p class='stepno'>Step "+(n+1)+" of "+tot+"</p><div class='steps' role='progressbar' aria-label='Lesson progress' aria-valuemin='1' aria-valuemax='"+tot+"' aria-valuenow='"+(n+1)+"'>"+bars+"</div>"+
"<section class='card'><h1 id='h' tabindex='-1'>"+s.t+"</h1>"+P(s.p)+(s.list?"<ul>"+s.list.map(function(x){return "<li>"+x+"</li>"}).join("")+"</ul>":"")+(s.ex?"<div class='ex'><strong>Example</strong>"+P(s.ex)+"</div>":"")+(s.note?"<div class='note'><strong>Good to know</strong><p>"+s.note+"</p></div>":"")+q+"</section>"+
(speech?"<button class='btn alt' data-act='read'>Read this step aloud</button>":"")+
"<div class='row'>"+(n?"<button class='btn alt' data-act='back'>Back</button>":"")+"<button class='btn' data-act='next'>"+(n<tot-1?"Next step":"Finish")+"</button></div><p class='stepno'>"+(n<tot-1?"Next: "+l.steps[n+1].t:"This is the last step.")+"</p>"},
fin:function(i){
st.done[i]=1;delete st.at[i];save();
app.innerHTML="<h1 id='h' tabindex='-1'>Lesson finished</h1><section class='card'><p>You finished: <strong>"+L[i].title+"</strong>.</p></section><div class='row'><button class='btn' data-act='home'>Pick another lesson</button><button class='btn alt' data-start='"+i+"'>Do this lesson again</button></div>"},
dec:function(){
app.innerHTML="<button class='btn alt' data-act='home'>Home</button><h1 id='h' tabindex='-1'>Work phrase decoder</h1><p>Some phrases at work do not mean exactly what the words say. Open a phrase to see what it usually means.</p>"+
D.map(function(d){return "<details><summary>"+d[0]+"</summary><p><strong>Usually means:</strong> "+d[1]+"</p><p>"+d[2]+"</p></details>"}).join("")},
plan:function(){
app.innerHTML="<button class='btn alt' data-act='home'>Home</button><h1 id='h' tabindex='-1'>My plan</h1><p>Write in your own words. This is saved only on this device.</p><h2>My interview answers</h2>"+
A.map(function(a,k){return "<label for='a"+k+"'>"+a+"</label><p class='stepno'>Starter: "+S[k]+"</p><textarea id='a"+k+"'></textarea>"}).join("")+
"<h2>What helps me at work</h2><p>Tick what helps you. Then make a message you can send to a manager.</p>"+
H.map(function(x,k){return "<label class='chk'><input type='checkbox' id='h"+k+"'> "+x+"</label>"}).join("")+
"<div class='row'><button class='btn' data-act='mk'>Make my message</button></div><div class='card' id='out' role='status'>Your message will show here.</div><div class='row'><button class='btn alt' data-act='cp'>Copy message</button></div>";
A.forEach(function(a,k){document.getElementById("a"+k).value=st.ans["a"+k]||""});
H.forEach(function(x,k){document.getElementById("h"+k).checked=!!st.help["h"+k]})}
};
function msg(){
var o=document.getElementById("out"),it=H.filter(function(x,k){return st.help["h"+k]});
o.textContent=it.length?"Hello. I do my best work when I have these things: "+it.join(", ")+". Can we talk about whether this is possible? Thank you.":"Tick at least one box first."}
app.addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
var d=b.dataset,a=d.act;
if(d.i!==undefined){go("ov",+d.i);return}
if(d.ov!==undefined){go("ov",+d.ov);return}
if(d.start!==undefined){go("lesson",+d.start,0);return}
if(d.q!==undefined){
var sq=L[ci].steps[cn].q,ok=+d.q===sq.a;
if(ok)b.classList.add("ok");
document.getElementById("fb").textContent=ok?sq.ok:sq.no;return}
if(a==="home")go("home");
else if(a==="dec")go("dec");
else if(a==="plan")go("plan");
else if(a==="next"){if(cn<L[ci].steps.length-1)go("lesson",ci,cn+1);else go("fin",ci)}
else if(a==="back")go("lesson",ci,cn-1);
else if(a==="mk")msg();
else if(a==="cp"){var t=document.getElementById("out").textContent;try{navigator.clipboard.writeText(t).then(function(){document.getElementById("out").textContent=t+" (Copied)"},function(){})}catch(x){}}
else if(a==="read"){
stop();
var t2=[].map.call(document.querySelectorAll("section h1,section p,section li"),function(x){return x.textContent}).join(". ");
var u=new SpeechSynthesisUtterance(t2);u.rate=.9;speechSynthesis.speak(u)}
});
app.addEventListener("input",function(e){
var t=e.target;
if(t.id&&t.id.charAt(0)==="a")st.ans[t.id]=t.value;
else if(t.id&&t.id.charAt(0)==="h")st.help[t.id]=t.checked;
save()});
document.querySelector(".tools").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;
var a=b.dataset.act;
if(a==="brk"){stop();app.innerHTML="<h1 id='h' tabindex='-1'>Taking a break</h1><section class='card'><p>This screen is quiet. Nothing moves. Your place is saved.</p><p>Come back when you are ready. There is no hurry.</p></section><div class='row'><button class='btn' data-act='ready'>I’m ready</button></div>";document.getElementById("h").focus();return}
if(a==="sm")st.fs=Math.max(1,st.fs-.125);
if(a==="lg")st.fs=Math.min(2,st.fs+.125);
if(a==="space")st.roomy=st.roomy?0:1;
if(a==="theme"){var c=st.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");st.theme=c==="dark"?"light":"dark"}
apply();save()});
app.addEventListener("click",function(e){var b=e.target.closest("button");if(b&&b.dataset.act==="ready")go.apply(null,cur)});
apply();go("home");
</script>
</body>
</html>
