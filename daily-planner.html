<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily planner</title>
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#14212b;--mute:#44566a;--brand:#0b6e6e;--bi:#fff;--soft:#e4eef1;--line:#b7c8cf;--ok:#17653a;--okbg:#ddf2e5;--fs:1.25rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",Arial,sans-serif;font-size:var(--fs);line-height:1.7;letter-spacing:.02em}
:root.roomy body{line-height:2.1;letter-spacing:.06em;word-spacing:.15em}
main{max-width:40rem;margin:0 auto;padding:1rem}
h1{font-size:1.5em;line-height:1.3;margin:.2em 0 .6em}
h2{font-size:1.15em;margin:1.5em 0 .5em}
p{margin:0 0 1em;max-width:34em}
ul,ol{padding-left:1.4em;margin:0 0 1em}
li{margin-bottom:.5em}
button,textarea,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.mini{min-height:2.75rem;padding:.25rem .9rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:.8em}
.btn{min-height:3.5rem;padding:.5rem 1.4rem;border:3px solid var(--brand);border-radius:.8rem;background:var(--brand);color:var(--bi);font-weight:bold}
.btn.alt{background:transparent;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0}
.row .btn{flex:1 1 9rem}
.card{display:block;width:100%;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin:0 0 1rem}
button.card:hover,button.card:focus-visible{border-color:var(--brand)}
button.card span{display:block;color:var(--mute);font-size:.85em}
.steps{display:flex;gap:.35rem;margin:.75rem 0 1rem}
.steps i{flex:1;height:.9rem;border-radius:.3rem;background:var(--soft);border:2px solid var(--line)}
.steps i.on{background:var(--brand);border-color:var(--brand)}
.stepno{margin:.75rem 0 0;color:var(--mute);font-size:.9em}
.note{border-left:.5rem solid var(--brand);background:var(--soft);border-radius:.5rem;padding:.6rem 1rem;margin:1rem 0}
.note p{margin:.4em 0}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem 1rem;min-height:3.25rem;border:3px solid var(--line);border-radius:.7rem;background:var(--soft);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
details{background:var(--card);border:3px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;margin-bottom:.75rem}
summary{cursor:pointer;font-weight:bold;min-height:2.75rem;display:flex;align-items:center}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:.7rem;border:3px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
textarea{min-height:7rem}
label{display:block;margin:.4rem 0;font-weight:bold}
.chk{display:flex;gap:.75rem;align-items:center;min-height:3rem;font-weight:normal}
.chk input{width:1.6rem;height:1.6rem;flex:none}
.big h1{font-size:2em}
.show{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center}
.show h1{font-size:2.1em}
.chip{display:inline-block;border:2px solid var(--line);border-radius:2rem;padding:.1rem .8rem;margin:.2rem;background:var(--soft);font-size:.85em}
.sm{min-height:2.75rem;padding:.2rem .8rem;font-size:.85em}
</style>
</head>
<body>
<main>
<div class="tools" role="group" aria-label="Display settings">
<button class="mini" data-s="sm">Smaller text</button>
<button class="mini" data-s="lg">Larger text</button>
<button class="mini" data-s="theme">Dark or light</button>
<button class="mini" data-s="space">More space</button>
<button class="mini" data-s="brk">Need a break</button>
</div>
<div id="app"></div>
<p class="stepno">Everyone is different. Please treat this tool as a starting point and ask people what works for them.</p>
</main>
<script>
var KEY="neuro-dp",app=document.getElementById("app"),root=document.documentElement,A={},I=null,cur=null,T=null;
var st={fs:1.25,theme:"",roomy:0,d:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function apply(){root.style.setProperty("--fs",st.fs+"rem");root.classList.toggle("roomy",!!st.roomy);if(st.theme){root.setAttribute("data-theme",st.theme)}else{root.removeAttribute("data-theme")}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function P(a){return a.map(function(x){return "<p>"+x+"</p>"}).join("")}
function bars(n,t){var b="";for(var k=0;k<t;k++)b+="<i"+(k<=n?" class='on'":"")+"></i>";return "<div class='steps' role='progressbar' aria-label='Progress' aria-valuemin='1' aria-valuemax='"+t+"' aria-valuenow='"+(n+1)+"'>"+b+"</div>"}
function go(fn){if(T){clearInterval(T);T=null}cur=fn;fn();var h=document.getElementById("h");if(h)h.focus();window.scrollTo(0,0)}
app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.act;if(a==="ready"){go(cur);return}if(a&&A[a])A[a](b)});
app.addEventListener("input",function(e){if(I)I(e)});
document.querySelector(".tools").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var a=b.dataset.s;
if(a==="brk"){if(T){clearInterval(T);T=null}app.innerHTML="<h1 id='h' tabindex='-1'>Taking a break</h1><section class='card'><p>This screen is quiet. Nothing moves. Your place is saved.</p><p>Come back when you are ready. There is no hurry.</p></section><div class='row'><button class='btn' data-act='ready'>I’m ready</button></div>";document.getElementById("h").focus();return}
if(a==="sm")st.fs=Math.max(1,st.fs-.125);
if(a==="lg")st.fs=Math.min(2,st.fs+.125);
if(a==="space")st.roomy=st.roomy?0:1;
if(a==="theme"){var c=st.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");st.theme=c==="dark"?"light":"dark"}
apply();save()});
apply();
st.d.items=st.d.items||[];
var RT={"Morning routine":["Wake up","Use the bathroom","Get dressed","Eat breakfast","Brush teeth","Pack my bag"],"Evening routine":["Eat dinner","Tidy up","Get clothes ready for tomorrow","Wash up","Brush teeth","Go to bed"]};
function nextIdx(from){for(var i=from;i<st.d.items.length;i++)if(!st.d.items[i].x)return i;return -1}
function board(){
var it=st.d.items,a=nextIdx(0),b=a<0?-1:nextIdx(a+1),n=it.length,dn=it.filter(function(x){return x.x}).length;
if(!n){go(edit);return}
app.innerHTML="<h1 id='h' tabindex='-1'>My day</h1>"+(a<0?"<section class='card big'><h1>All done for today</h1></section>":"<section class='card big'><p class='stepno'>First</p><h1>"+esc(it[a].t)+"</h1></section><section class='card'><p class='stepno'>Then</p><p><strong>"+(b<0?"Nothing else. This is the last one.":esc(it[b].t))+"</strong></p></section><div class='row'><button class='btn' data-act='done' data-i='"+a+"'>Done</button></div>")+"<p class='stepno'>"+dn+" of "+n+" finished</p><h2>Whole day</h2><ul>"+it.map(function(x){return "<li>"+(x.x?"Done: ":"")+esc(x.t)+"</li>"}).join("")+"</ul><div class='row'><button class='btn alt' data-act='edit'>Change my list</button><button class='btn alt' data-act='reset'>Start the day over</button></div>"}
function edit(){
var it=st.d.items;
app.innerHTML="<h1 id='h' tabindex='-1'>My list</h1><p>Add things in the order you want to do them. If plans change, move things up or down.</p><label for='ni'>New thing to do</label><input type='text' id='ni' maxlength='80'><div class='row'><button class='btn' data-act='add'>Add</button></div><h2>Quick routines</h2><div class='row'>"+Object.keys(RT).map(function(k){return "<button class='btn alt' data-act='rt' data-k='"+k+"'>"+k+"</button>"}).join("")+"</div>"+(it.length?"<h2>In order</h2>"+it.map(function(x,i){return "<div class='card'><p>"+esc(x.t)+"</p><button class='btn alt sm' data-act='up' data-i='"+i+"'>Move up</button> <button class='btn alt sm' data-act='dn' data-i='"+i+"'>Move down</button> <button class='btn alt sm' data-act='del' data-i='"+i+"'>Remove</button></div>"}).join("")+"<div class='row'><button class='btn' data-act='board'>Show my day</button></div>":"")}
A.board=function(){go(board)};
A.edit=function(){go(edit)};
A.add=function(){var v=document.getElementById("ni").value.trim();if(v){st.d.items.push({t:v,x:0});save();go(edit)}};
A.rt=function(b){RT[b.dataset.k].forEach(function(t){st.d.items.push({t:t,x:0})});save();go(edit)};
A.del=function(b){st.d.items.splice(+b.dataset.i,1);save();go(edit)};
A.up=function(b){var i=+b.dataset.i,it=st.d.items;if(i>0){var t=it[i];it[i]=it[i-1];it[i-1]=t;save();go(edit)}};
A.dn=function(b){var i=+b.dataset.i,it=st.d.items;if(i<it.length-1){var t=it[i];it[i]=it[i+1];it[i+1]=t;save();go(edit)}};
A.done=function(b){st.d.items[+b.dataset.i].x=1;save();go(board)};
A.reset=function(){st.d.items.forEach(function(x){x.x=0});save();go(board)};
go(board);

</script>
</body>
</html>
