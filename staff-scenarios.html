<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What would you do?</title>
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#14212b;--mute:#44566a;--brand:#0b6e6e;--bi:#fff;--soft:#e4eef1;--line:#b7c8cf;--ok:#17653a;--okbg:#ddf2e5;--fs:1.25rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",Arial,sans-serif;font-size:var(--fs);line-height:1.7;letter-spacing:.02em}
:root.roomy body{line-height:2.1;letter-spacing:.06em;word-spacing:.15em}
main{max-width:40rem;margin:0 auto;padding:1rem}
h1{font-size:1.5em;line-height:1.3;margin:.2em 0 .6em}
h2{font-size:1.15em;margin:1.5em 0 .5em}
p{margin:0 0 1em;max-width:34em}
ul,ol{padding-left:1.4em;margin:0 0 1em}
li{margin-bottom:.5em}
button,textarea,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.mini{min-height:2.75rem;padding:.25rem .9rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:.8em}
.btn{min-height:3.5rem;padding:.5rem 1.4rem;border:3px solid var(--brand);border-radius:.8rem;background:var(--brand);color:var(--bi);font-weight:bold}
.btn.alt{background:transparent;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0}
.row .btn{flex:1 1 9rem}
.card{display:block;width:100%;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin:0 0 1rem}
button.card:hover,button.card:focus-visible{border-color:var(--brand)}
button.card span{display:block;color:var(--mute);font-size:.85em}
.steps{display:flex;gap:.35rem;margin:.75rem 0 1rem}
.steps i{flex:1;height:.9rem;border-radius:.3rem;background:var(--soft);border:2px solid var(--line)}
.steps i.on{background:var(--brand);border-color:var(--brand)}
.stepno{margin:.75rem 0 0;color:var(--mute);font-size:.9em}
.note{border-left:.5rem solid var(--brand);background:var(--soft);border-radius:.5rem;padding:.6rem 1rem;margin:1rem 0}
.note p{margin:.4em 0}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem 1rem;min-height:3.25rem;border:3px solid var(--line);border-radius:.7rem;background:var(--soft);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
details{background:var(--card);border:3px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;margin-bottom:.75rem}
summary{cursor:pointer;font-weight:bold;min-height:2.75rem;display:flex;align-items:center}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:.7rem;border:3px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
textarea{min-height:7rem}
label{display:block;margin:.4rem 0;font-weight:bold}
.chk{display:flex;gap:.75rem;align-items:center;min-height:3rem;font-weight:normal}
.chk input{width:1.6rem;height:1.6rem;flex:none}
.big h1{font-size:2em}
.show{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center}
.show h1{font-size:2.1em}
.chip{display:inline-block;border:2px solid var(--line);border-radius:2rem;padding:.1rem .8rem;margin:.2rem;background:var(--soft);font-size:.85em}
.sm{min-height:2.75rem;padding:.2rem .8rem;font-size:.85em}
</style>
</head>
<body>
<main>
<div class="tools" role="group" aria-label="Display settings">
<button class="mini" data-s="sm">Smaller text</button>
<button class="mini" data-s="lg">Larger text</button>
<button class="mini" data-s="theme">Dark or light</button>
<button class="mini" data-s="space">More space</button>
<button class="mini" data-s="brk">Need a break</button>
</div>
<div id="app"></div>
<p class="stepno">Everyone is different. Please treat this tool as a starting point and ask people what works for them.</p>
</main>
<script>
var KEY="neuro-ss",app=document.getElementById("app"),root=document.documentElement,A={},I=null,cur=null,T=null;
var st={fs:1.25,theme:"",roomy:0,d:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function apply(){root.style.setProperty("--fs",st.fs+"rem");root.classList.toggle("roomy",!!st.roomy);if(st.theme){root.setAttribute("data-theme",st.theme)}else{root.removeAttribute("data-theme")}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function P(a){return a.map(function(x){return "<p>"+x+"</p>"}).join("")}
function bars(n,t){var b="";for(var k=0;k<t;k++)b+="<i"+(k<=n?" class='on'":"")+"></i>";return "<div class='steps' role='progressbar' aria-label='Progress' aria-valuemin='1' aria-valuemax='"+t+"' aria-valuenow='"+(n+1)+"'>"+b+"</div>"}
function go(fn){if(T){clearInterval(T);T=null}cur=fn;fn();var h=document.getElementById("h");if(h)h.focus();window.scrollTo(0,0)}
app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.act;if(a==="ready"){go(cur);return}if(a&&A[a])A[a](b)});
app.addEventListener("input",function(e){if(I)I(e)});
document.querySelector(".tools").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var a=b.dataset.s;
if(a==="brk"){if(T){clearInterval(T);T=null}app.innerHTML="<h1 id='h' tabindex='-1'>Taking a break</h1><section class='card'><p>This screen is quiet. Nothing moves. Your place is saved.</p><p>Come back when you are ready. There is no hurry.</p></section><div class='row'><button class='btn' data-act='ready'>I’m ready</button></div>";document.getElementById("h").focus();return}
if(a==="sm")st.fs=Math.max(1,st.fs-.125);
if(a==="lg")st.fs=Math.min(2,st.fs+.125);
if(a==="space")st.roomy=st.roomy?0:1;
if(a==="theme"){var c=st.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");st.theme=c==="dark"?"light":"dark"}
apply();save()});
apply();
var SC=[
{s:"A customer covers their ears and says the store music is too loud.",o:[
["Ask what would help. Offer to turn the music down or point to a quieter spot.",1,"Yes. Asking and offering a choice respects the person and solves the problem. Small changes like this help many people."],
["Tell them it is not that loud.",0,"This tells them their experience is wrong. Loudness feels different to different people, and sensory differences are real."],
["Ignore it. Everyone has to deal with noise.",0,"Ignoring it can make a person leave or feel unwelcome. A quick, kind offer costs very little."]]},
{s:"In a meeting, a coworker looks at their notes while you talk. They do not look at you.",o:[
["They may be listening well. Judge the work, not eye contact.",1,"Yes. Many autistic people find eye contact uncomfortable or distracting, and can listen better without it."],
["They are being rude.",0,"Looking away is not rudeness. Reading it that way can lead to unfair judgments."],
["Ask them to look at you when you talk.",0,"Making someone force eye contact can use up their energy and make it harder to follow the conversation."]]},
{s:"A student rocks back and forth while working quietly.",o:[
["Leave them be. Rocking or other stimming often helps people calm down or focus.",1,"Yes. Only step in if the movement is unsafe. Stopping it can increase stress."],
["Tell them to stop.",0,"Being told to stop can raise anxiety and teach people to hide what helps them."],
["Offer a reward for sitting still.",0,"Rewards for sitting still can push a student to hide their needs, which can be tiring and harmful over time."]]},
{s:"You told a customer the wait would be “soon”. They keep asking exactly how long it will be.",o:[
["Give a clear answer. Say a time, or say “I don’t know yet, and I will update you at 3:00.”",1,"Yes. “Soon” can mean different things. A time or a plan is clear and kind."],
["Say “I already told you, soon.”",0,"The question is a fair one. A vague word does not give them what they need to plan."],
["Say “Don’t worry about it.”",0,"This does not answer the question and can feel dismissive."]]},
{s:"After a loud event, a coworker goes quiet, covers their face, and cannot answer you.",o:[
["Lower demands. Offer a quiet space. Do not crowd them. Check in later.",1,"Yes. Overload can make speaking very hard. Quiet, space, and time often help most."],
["Keep asking questions until they answer.",0,"More questions add more pressure when the person is already overloaded."],
["Tell everyone what is happening.",0,"This can add embarrassment and attention. Keep it private and calm."]]},
{s:"A coworker with ADHD often misses details in long emails and sometimes misses deadlines.",o:[
["Offer short written summaries and clear deadlines. Ask what format works best for them.",1,"Yes. Clear structure and asking the person what helps are practical and respectful."],
["Tell them to try harder.",0,"ADHD is not a lack of effort. “Try harder” does not change how attention works, and it can hurt."],
["Quietly take away their responsibilities.",0,"Taking over without asking removes their chance to succeed with the right support."]]},
{s:"A student with ADHD keeps getting up and fidgeting during a long lesson.",o:[
["Plan movement breaks. Allow quiet fidget tools. Keep tasks short with clear steps.",1,"Yes. Movement can help some people focus, and structure helps with sustained attention."],
["Make them stay seated and take away recess.",0,"Punishing movement does not build attention, and it takes away time that helps regulate energy."],
["Call out their name each time they get up.",0,"Public correction can bring shame and does not teach a useful skill."]]}
];
var KEYS=["Ask. Do not assume. Offer choices.","Reduce sound, light, and communication barriers when you can.","Judge the work, not eye contact or stimming.","Be clear and direct. Give times and examples.","Everyone is different. Ask the person what helps them."];
var n=0,good=0;
function home(){app.innerHTML="<h1 id='h' tabindex='-1'>What would you do?</h1><p>Seven short situations for teachers, store workers, and coworkers. Pick a response. You will see why it helps or does not. There are no scores to share.</p><div class='row'><button class='btn' data-act='start'>Start</button></div>"}
function ask(){var s=SC[n];app.innerHTML="<button class='btn alt' data-act='home'>Home</button><p class='stepno'>Situation "+(n+1)+" of "+SC.length+"</p>"+bars(n,SC.length)+"<section class='card'><h1 id='h' tabindex='-1'>"+s.s+"</h1>"+s.o.map(function(o,i){return "<button class='opt' data-act='pick' data-i='"+i+"'>"+o[0]+"</button>"}).join("")+"<p id='fb' role='status'></p></section><div class='row' id='nx'></div>"}
function fin(){app.innerHTML="<h1 id='h' tabindex='-1'>Key ideas</h1><p>You chose the most helpful response "+good+" times out of "+SC.length+". What matters is what you take from it.</p><section class='card'><ul>"+KEYS.map(function(k){return "<li>"+k+"</li>"}).join("")+"</ul></section><div class='row'><button class='btn' data-act='start'>Try again</button></div>"}
A.home=function(){go(home)};
A.start=function(){n=0;good=0;go(ask)};
A.pick=function(b){var o=SC[n].o[+b.dataset.i],fb=document.getElementById("fb");
if(fb.dataset.done)return;fb.dataset.done=1;if(o[1]){good++;b.classList.add("ok")}
fb.innerHTML="<strong>"+(o[1]?"Helpful.":"Not the most helpful.")+"</strong> "+o[2];
document.getElementById("nx").innerHTML="<button class='btn' data-act='next'>"+(n<SC.length-1?"Next situation":"See key ideas")+"</button>"};
A.next=function(){if(n<SC.length-1){n++;go(ask)}else go(fin)};
go(home);

</script>
</body>
</html>
