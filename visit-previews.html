<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visit previews</title>
<style>
:root{--bg:#f3f7f9;--card:#fff;--ink:#14212b;--mute:#44566a;--brand:#0b6e6e;--bi:#fff;--soft:#e4eef1;--line:#b7c8cf;--ok:#17653a;--okbg:#ddf2e5;--fs:1.25rem;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}}
:root[data-theme="dark"]{--bg:#0f1a22;--card:#17252f;--ink:#eef4f7;--mute:#b4c3cc;--brand:#5fd0c9;--bi:#06201f;--soft:#21323d;--line:#3d5361;--ok:#8be0a8;--okbg:#173a27}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Verdana,Tahoma,"Segoe UI",Arial,sans-serif;font-size:var(--fs);line-height:1.7;letter-spacing:.02em}
:root.roomy body{line-height:2.1;letter-spacing:.06em;word-spacing:.15em}
main{max-width:40rem;margin:0 auto;padding:1rem}
h1{font-size:1.5em;line-height:1.3;margin:.2em 0 .6em}
h2{font-size:1.15em;margin:1.5em 0 .5em}
p{margin:0 0 1em;max-width:34em}
ul,ol{padding-left:1.4em;margin:0 0 1em}
li{margin-bottom:.5em}
button,textarea,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.mini{min-height:2.75rem;padding:.25rem .9rem;border:2px solid var(--line);border-radius:.6rem;background:var(--card);color:var(--ink);font-size:.8em}
.btn{min-height:3.5rem;padding:.5rem 1.4rem;border:3px solid var(--brand);border-radius:.8rem;background:var(--brand);color:var(--bi);font-weight:bold}
.btn.alt{background:transparent;color:var(--brand)}
.row{display:flex;flex-wrap:wrap;gap:.75rem;margin:1rem 0}
.row .btn{flex:1 1 9rem}
.card{display:block;width:100%;box-sizing:border-box;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--line);border-radius:1rem;padding:1rem 1.25rem;margin:0 0 1rem}
button.card:hover,button.card:focus-visible{border-color:var(--brand)}
button.card span{display:block;color:var(--mute);font-size:.85em}
.steps{display:flex;gap:.35rem;margin:.75rem 0 1rem}
.steps i{flex:1;height:.9rem;border-radius:.3rem;background:var(--soft);border:2px solid var(--line)}
.steps i.on{background:var(--brand);border-color:var(--brand)}
.stepno{margin:.75rem 0 0;color:var(--mute);font-size:.9em}
.note{border-left:.5rem solid var(--brand);background:var(--soft);border-radius:.5rem;padding:.6rem 1rem;margin:1rem 0}
.note p{margin:.4em 0}
.opt{display:block;width:100%;text-align:left;margin:.5rem 0;padding:.75rem 1rem;min-height:3.25rem;border:3px solid var(--line);border-radius:.7rem;background:var(--soft);color:var(--ink)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
details{background:var(--card);border:3px solid var(--line);border-radius:.8rem;padding:.5rem 1rem;margin-bottom:.75rem}
summary{cursor:pointer;font-weight:bold;min-height:2.75rem;display:flex;align-items:center}
textarea,input[type=text]{width:100%;box-sizing:border-box;padding:.7rem;border:3px solid var(--line);border-radius:.7rem;background:var(--card);color:var(--ink)}
textarea{min-height:7rem}
label{display:block;margin:.4rem 0;font-weight:bold}
.chk{display:flex;gap:.75rem;align-items:center;min-height:3rem;font-weight:normal}
.chk input{width:1.6rem;height:1.6rem;flex:none}
.big h1{font-size:2em}
.show{min-height:55vh;display:flex;align-items:center;justify-content:center;text-align:center}
.show h1{font-size:2.1em}
.chip{display:inline-block;border:2px solid var(--line);border-radius:2rem;padding:.1rem .8rem;margin:.2rem;background:var(--soft);font-size:.85em}
.sm{min-height:2.75rem;padding:.2rem .8rem;font-size:.85em}
</style>
</head>
<body>
<main>
<div class="tools" role="group" aria-label="Display settings">
<button class="mini" data-s="sm">Smaller text</button>
<button class="mini" data-s="lg">Larger text</button>
<button class="mini" data-s="theme">Dark or light</button>
<button class="mini" data-s="space">More space</button>
<button class="mini" data-s="brk">Need a break</button>
</div>
<div id="app"></div>
<p class="stepno">Everyone is different. Please treat this tool as a starting point and ask people what works for them.</p>
</main>
<script>
var KEY="neuro-vp",app=document.getElementById("app"),root=document.documentElement,A={},I=null,cur=null,T=null;
var st={fs:1.25,theme:"",roomy:0,d:{}};
try{Object.assign(st,JSON.parse(localStorage.getItem(KEY)||"{}"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function apply(){root.style.setProperty("--fs",st.fs+"rem");root.classList.toggle("roomy",!!st.roomy);if(st.theme){root.setAttribute("data-theme",st.theme)}else{root.removeAttribute("data-theme")}}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return "&#"+c.charCodeAt(0)+";"})}
function P(a){return a.map(function(x){return "<p>"+x+"</p>"}).join("")}
function bars(n,t){var b="";for(var k=0;k<t;k++)b+="<i"+(k<=n?" class='on'":"")+"></i>";return "<div class='steps' role='progressbar' aria-label='Progress' aria-valuemin='1' aria-valuemax='"+t+"' aria-valuenow='"+(n+1)+"'>"+b+"</div>"}
function go(fn){if(T){clearInterval(T);T=null}cur=fn;fn();var h=document.getElementById("h");if(h)h.focus();window.scrollTo(0,0)}
app.addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;var a=b.dataset.act;if(a==="ready"){go(cur);return}if(a&&A[a])A[a](b)});
app.addEventListener("input",function(e){if(I)I(e)});
document.querySelector(".tools").addEventListener("click",function(e){
var b=e.target.closest("button");if(!b)return;var a=b.dataset.s;
if(a==="brk"){if(T){clearInterval(T);T=null}app.innerHTML="<h1 id='h' tabindex='-1'>Taking a break</h1><section class='card'><p>This screen is quiet. Nothing moves. Your place is saved.</p><p>Come back when you are ready. There is no hurry.</p></section><div class='row'><button class='btn' data-act='ready'>I’m ready</button></div>";document.getElementById("h").focus();return}
if(a==="sm")st.fs=Math.max(1,st.fs-.125);
if(a==="lg")st.fs=Math.min(2,st.fs+.125);
if(a==="space")st.roomy=st.roomy?0:1;
if(a==="theme"){var c=st.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");st.theme=c==="dark"?"light":"dark"}
apply();save()});
apply();
var PV=[
{n:"Going to the dentist",chips:["Bright lights","Loud tools","Strong smells","Waiting"],tip:"Headphones or sunglasses can help with sound and light.",ask:["Can I see the room first?","Can you tell me each step before you do it?","Can we agree on a signal to stop?"],s:[
["Arriving","A front desk and a waiting room.","A phone ringing and quiet talking.","Tell the desk your name."],
["Waiting","Chairs, magazines, maybe a TV. You may wait 5 to 20 minutes.","Sounds from other rooms, like a drill.","You can ask to wait outside and get a text when it is your turn."],
["Going in","A big chair and a bright light above it.","Someone says hello and explains what will happen.","Sit in the chair. You can ask to see the tools first."],
["The check-up","A small mirror and a tool to clean your teeth.","Scraping and a vacuum sound. It can be loud.","Raise your hand if you need a pause."],
["Finishing","The dentist tells you what they found.","People talk about your next visit.","Book your next visit, or ask them to email you."]]},
{n:"Flying at an airport",chips:["Crowds","Announcements","Queues","Security checks"],tip:"Many airports and airlines can arrange help if you ask before the trip. Contact them early.",ask:["Can I get help or a quieter route through the airport?","What do I need to take out of my bag at security?","Where can I wait away from the crowd?"],s:[
["Arriving","A big building with many people and signs.","Announcements and rolling suitcases.","Find your airline’s desk or the self check-in machines."],
["Check-in and bags","A desk or machine. A staff member checks your ID and ticket.","Short questions like “Are you checking a bag?”","Show your ID and ticket. You get a boarding pass."],
["Security","A line, plastic bins, and a scanner you walk through.","Staff giving short instructions, and beeps.","Put items in the bin. Follow the signs. You can ask staff to explain each step."],
["Waiting at the gate","Seats and a screen showing your gate and time.","Announcements. They can be loud and hard to hear.","Check the screen. Headphones are fine."],
["Boarding and flying","A narrow aisle and your seat.","Engine noise. A bell sometimes rings when the seatbelt sign changes.","Sit and buckle up. Bring something calming to hold or do."]]},
{n:"Voting",chips:["Lines","Talking with staff","Paper or machine"],tip:"Rules and places are different in every area. Check with your local election office for yours. Many places also offer early or mail voting.",ask:["Where is my voting place?","What ID, if any, do I need?","Can I vote early or by mail?"],s:[
["Arriving","A building like a school or community hall. There may be a line.","People talking and staff giving directions.","Follow the signs. Ask a worker if you are unsure."],
["Checking in","A table with workers and a list of voters.","A worker asks for your name, and maybe ID.","Say your name. Show ID if your area asks for it."],
["Getting your ballot","You get a paper ballot or go to a voting machine.","Workers explain how it works in a few sentences.","You can ask them to explain again."],
["Marking your choices","A private booth or screen.","Mostly quiet.","Take your time. You can bring notes you made at home if your area allows it."],
["Finishing","A box or scanner where the ballot goes.","A worker may give you a sticker.","Put your ballot where they show you. You are done."]]},
{n:"A job fair",chips:["Crowds","Many conversations","Noise","Walking around"],tip:"A short walk around first can help you see the room before you talk to anyone.",ask:["Which companies will be there? Can I see the list first?","Is there a quiet time or quiet area?","Can I send my resume online instead?"],s:[
["Arriving and signing in","A table with name tags and a list.","Staff saying hello and giving short instructions.","Write your name on a tag. Pick up a map if there is one."],
["Walking the room","Rows of booths with banners and tables.","Many people talking at once.","Walk once without stopping. Pick 2 or 3 booths."],
["Talking to a company","Someone at a table with brochures.","A short chat, usually 2 to 5 minutes.","Say hello and your name. Say what job you are looking for. Hand over your resume."],
["Asking questions","The same table.","They may ask “Do you have any questions?”","Ask one question from your list, like “What does a normal day look like?”"],
["Leaving","The exit and maybe a quiet hallway.","Quieter sounds.","Write notes about who you met. Send a thank-you message later."]]}
];
var pi=0,pn=0;
function home(){app.innerHTML="<h1 id='h' tabindex='-1'>Visit previews</h1><p>See what a place is like before you go. Each preview shows what you will see, hear, and do. Places differ, so call ahead if you can.</p>"+PV.map(function(p,i){return "<button class='card' data-act='open' data-i='"+i+"'><strong>"+p.n+"</strong><span>"+p.s.length+" steps</span></button>"}).join("")}
function intro(){var p=PV[pi];app.innerHTML="<button class='btn alt' data-act='home'>All previews</button><h1 id='h' tabindex='-1'>"+p.n+"</h1><p>You may notice:</p><p>"+p.chips.map(function(c){return "<span class='chip'>"+c+"</span>"}).join("")+"</p><div class='note'><p>"+p.tip+"</p></div><h2>Steps</h2><ol>"+p.s.map(function(s){return "<li>"+s[0]+"</li>"}).join("")+"</ol><div class='row'><button class='btn' data-act='start'>Start the preview</button></div>"}
function step(){var p=PV[pi],s=p.s[pn],t=p.s.length;
app.innerHTML="<button class='btn alt' data-act='intro'>Back to overview</button><p class='stepno'>Step "+(pn+1)+" of "+t+"</p>"+bars(pn,t)+"<section class='card'><h1 id='h' tabindex='-1'>"+s[0]+"</h1><div class='note'><strong>You will see</strong><p>"+s[1]+"</p></div><div class='note'><strong>You may hear</strong><p>"+s[2]+"</p></div><div class='note'><strong>You can do</strong><p>"+s[3]+"</p></div></section><div class='row'>"+(pn?"<button class='btn alt' data-act='prev'>Back</button>":"")+"<button class='btn' data-act='next'>"+(pn<t-1?"Next step":"Finish")+"</button></div><p class='stepno'>"+(pn<t-1?"Next: "+p.s[pn+1][0]:"This is the last step.")+"</p>"}
function end(){var p=PV[pi];app.innerHTML="<h1 id='h' tabindex='-1'>You have seen every step</h1><section class='card'><p><strong>Questions you can ask before you go:</strong></p><ul>"+p.ask.map(function(a){return "<li>"+a+"</li>"}).join("")+"</ul></section><div class='row'><button class='btn' data-act='home'>Pick another preview</button><button class='btn alt' data-act='start'>See it again</button></div>"}
A.home=function(){go(home)};
A.open=function(b){pi=+b.dataset.i;go(intro)};
A.intro=function(){go(intro)};
A.start=function(){pn=0;go(step)};
A.next=function(){if(pn<PV[pi].s.length-1){pn++;go(step)}else go(end)};
A.prev=function(){pn--;go(step)};
go(home);

</script>
</body>
</html>
